<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8d8446">
  <title>The Backrooms — Level 0</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="Game">
    <div id="StartScreen">
      <div class="MenuNoise"></div>
      <div class="MenuTop">
        <span>THE BACKROOMS</span>
        <span>LEVEL 0</span>
      </div>
      <div class="MenuContent">
        <div class="MenuIndex">00</div>
        <h1>NOCLIP.</h1>
        <p>Three breakers power the only known exit. Once the building notices you, keep moving.</p>
        <button id="StartButton">
          <span id="StartButtonText">ENTER LEVEL 0</span>
          <span class="ButtonArrow">→</span>
        </button>
        <div id="LoadStatus">WASD · SHIFT · MOUSE · E</div>
      </div>
      <div class="MenuFooter">
        <span>PROCEDURAL SESSION</span>
        <span>ESC RELEASES CURSOR</span>
      </div>
    </div>

    <div id="Hud" class="Hidden">
      <div id="LevelHud">
        <div class="HudLabel">LEVEL 0</div>
        <div id="Objective">RESTORE POWER · 0/3</div>
      </div>
      <div id="Fps">-- FPS</div>
      <div id="Prompt"></div>
      <div id="Crosshair"><i></i></div>
      <div id="StaminaHud">
        <span>SPRINT</span>
        <div id="StaminaFrame"><div id="StaminaBar"></div></div>
      </div>
      <div id="CursorNotice" class="Hidden">CLICK TO CAPTURE MOUSE</div>
    </div>

    <div id="Message"></div>

    <div id="EndScreen" class="Hidden">
      <div class="EndContent">
        <div class="Eyebrow" id="EndEyebrow">LEVEL 0</div>
        <h1 id="EndTitle">YOU ESCAPED</h1>
        <p id="EndText"></p>
        <button id="RestartButton">NEW SESSION <span class="ButtonArrow">→</span></button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/boot.js"></script>
</body>
</html>
